"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
command_timeout = 1000
format = """
$os\
$username\
$hostname\
$kubernetes\
$directory\
$git_branch\
$git_state\
$git_status\
$docker_context\
$helm\
$nodejs\
$golang\
$dotnet\
$python\
$rust\
$gcloud\
$direnv\
$jobs\
$cmd_duration\
$fill\
$status\
$memory_usage\
$time\
$line_break\
$character"""
[fill]
symbol=' '
[memory_usage]
disabled =false
threshold=1
format="[$ram](bold blue) $symbol"
symbol=" 󰍛"

[time]
disabled = false
style="bold blue"
format=" [$time](green) 󰥔  "

[character]
# second line: blue arrow normally, red after a failing command, vim-mode glyph in vicmd
success_symbol = '[➜](bold blue)'
error_symbol = '[➜](bold red)'
vimcmd_symbol = '[](bold green)'


[os]
format = '[$symbol](bold white) '   
disabled = false

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "
Windows = "󰍲 "

[username]
style_user = 'white bold'
style_root = 'white bold'
format = '[$user]($style) '
disabled = false
show_always = true

[hostname]
ssh_only = false
format = 'on [$hostname](bold yellow) '
disabled = false


[directory]
truncation_length = 1
truncation_symbol = '…/'
home_symbol = '󰋜 ~'
read_only_style = '197'
read_only = '  '
format = 'at [$path]($style)[$read_only]($read_only_style) '


# Shows current git branch
[git_branch]
symbol = ' '
format = 'via [$symbol$branch]($style)'
# truncation_length = 4
truncation_symbol = '…/'
style = 'bold green'

# Shows current git status
[git_status]
format = '[$all_status$ahead_behind]($style) '
style = 'bold green'
conflicted = '🏳'
up_to_date = ''
untracked = ' '
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
stashed = '  '
modified = ' '
staged = '[++\($count\)](green)'
renamed = '襁 '
deleted = ' '

# Shows kubernetes context and namespace
[kubernetes]
format = 'via [󱃾 $context\($namespace\)]($style) '
style = 'bold purple'
disabled = false
# only show when it matters: k8s files in the repo or an explicit KUBECONFIG
detect_files = ['Chart.yaml', 'kustomization.yaml', 'helmfile.yaml', 'skaffold.yaml', 'Tiltfile']
detect_folders = ['k8s', 'kubernetes', 'charts', 'manifests', 'helm']
detect_env_vars = ['KUBECONFIG']

# anything that looks like production is shouted in red
[[kubernetes.contexts]]
context_pattern = '.*(prod|prd|production).*'
style = 'bold red'
context_alias = '⚠ $0'

[[kubernetes.contexts]]
context_pattern = 'k3s-local'
style = 'bold green'
context_alias = 'local'

# ---

[vagrant]
disabled = true

[docker_context]
disabled = false

[helm]
disabled = false

[python]
disabled = false
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[nodejs]
disabled = false
format = 'via [$symbol($version )]($style)'

[ruby]
disabled = true

[terraform]
disabled = true

[cmd_duration]
format='[$duration](bold cyan) '
min_time=5

[golang]
format = 'via [$symbol($version )]($style)'

[dotnet]
format = 'via [$symbol($version )(🎯 $tfm )]($style)'

[rust]
format = 'via [$symbol($version )]($style)'

[gcloud]
format = 'on [$symbol$account(@$domain)(\($project\))]($style) '
# only when a non-default config is active (switch_gcp_credentials sets one)
detect_env_vars = ['CLOUDSDK_CONFIG', 'CLOUDSDK_ACTIVE_CONFIG_NAME', 'GOOGLE_APPLICATION_CREDENTIALS']

[direnv]
disabled = false
format = '[$symbol$loaded/$allowed]($style) '

[status]
disabled = false
format = '[$symbol$status]($style) '
symbol = '✗ '
map_symbol = true
pipestatus = true

[jobs]
symbol = ' '

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '

# Only additions/overrides; yazi's default keymap still applies (press F1 or ~ for help).
# Defaults: https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/keymap-default.toml
#:schema https://yazi-rs.github.io/schemas/keymap.json

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on   = ["c", "m"]
run  = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on   = ["g", "r"]
run  = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Go to the git repository root"

[[mgr.prepend_keymap]]
on   = ["g", "D"]
run  = "cd $DOT_FILES_DIR"
desc = "Go to the dotfiles repo"

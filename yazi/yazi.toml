# Only overrides of yazi's built-in defaults; everything else comes from the preset
# shipped with the binary, so upgrades never break this file.
# Defaults: https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/yazi-default.toml
#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
show_hidden  = true
mouse_events = ["click", "scroll"] # no "drag": it fights with terminal text selection
linemode     = "size"

# git status signs in the file list (plugin: yazi-rs/plugins:git, see init.lua)
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

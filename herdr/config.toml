onboarding = false

[ui]
agent_panel_sort = "spaces"
sidebar_start_collapsed=true
sidebar_collapsed_mode="compact"

[experimental]
kitty_graphics = true
pane_history = false

[terminal]
new_cwd="follow"

[keys]
prefix = "ctrl+b"
goto = "prefix+g"
new_tab = "prefix+c"
# next_tab = "prefix+n"
# previous_tab = "prefix+N"
focus_pane_left = "prefix+h"
navigate_workspace_down = "j"
toggle_sidebar= "prefix+-"
split_horizontal= "prefix+V"
new_workspace="prefix+shift+n"







[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sidebar.agents]
# `rows = []` hid everything except the state icon.
# line 1: icon, agent name (claude, copilot, ...), workspace, tab
# line 2: the agent's terminal title (Claude Code puts the current task there),
#         spinner glyph stripped; empty lines disappear on their own
rows = [
  ["state_icon", { token = "agent", bold = true }, "workspace", "tab"],
  [{ token = "terminal_title_stripped", dim = true }],
]


[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"




[theme]
name = "catppuccin"
auto_switch = false

onboarding = false

[ui]
agent_panel_sort = "spaces"
sidebar_start_collapsed=true
sidebar_collapsed_mode="compact"

[experimental]
kitty_graphics = true
pane_history = false

[terminal]
new_cwd="follow"

[keys]
prefix = "ctrl+b"
goto = "prefix+g"
new_tab = "prefix+c"
# next_tab = "prefix+n"
# previous_tab = "prefix+N"
focus_pane_left = "prefix+h"
navigate_workspace_down = "j"
navigate_pane_down = "ctrl+j"
toggle_sidebar= "prefix+-"
split_horizontal= "prefix+V"
new_workspace="prefix+shift+n"







[ui.sidebar.spaces]
rows=[["state_icon", "workspace"], ["branch", "git_status"]]
[ui.sidebar.agents]
rows=[]


[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-nvim-nav.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-nvim-nav.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-nvim-nav.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-nvim-nav.right"




[theme]
name = "catppuccin"
auto_switch = false

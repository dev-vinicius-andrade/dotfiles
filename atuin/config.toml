# atuin — only settings that differ from the defaults.
# Full reference: https://docs.atuin.sh/configuration/config/   (`atuin config print` shows the effective config)

sync_address = "https://atuin.andrades.cloud"
search_mode = "fuzzy"
enter_accept = true

# Ctrl-R opens on the current git repo when inside one; Ctrl-R again cycles global/host/session/dir
workspaces = true
filter_mode = "global"
style = "compact"
inline_height = 25
show_preview = true

# Keep credentials out of (synced!) history. secrets_filter already catches AWS/GitHub/Slack/... tokens;
# these cover inline exports, curl auth headers and the self-hosted APIs used here.
secrets_filter = true
history_filter = [
  '(?i)^\s*export\s+\w*(TOKEN|SECRET|PASSWORD|PASSWD|API_?KEY|PRIVATE_KEY)\w*=',
  '(?i)authorization:\s*(bearer|basic|pveapitoken)',
  '(?i)--(password|token|api-key|secret)[= ]\S+',
  '(?i)\b(PROXMOX_VE_API_TOKEN|PFSENSE_API_KEY|TECHNITIUM_TOKEN)=',
]

[stats]
# count `kubectl get` / `git push` instead of just `kubectl` / `git`
common_subcommands = [
  "cargo", "docker", "dotnet", "git", "go", "helm", "herdr", "ip", "kubectl",
  "npm", "pnpm", "podman", "sops", "systemctl", "ya", "yarn", "envmgr",
]
common_prefix = ["sudo"]
# navigation noise hides what you actually do
ignored_commands = ["cd", "z", "ls", "ll", "la", "clear", "exit", "y"]

[daemon]
# background daemon: sync off the prompt path, faster search. Started on demand.
enabled = true
autostart = true

[ui]
# host + exit code matter when history is synced across machines
columns = ["exit", "duration", "time", "host", "command"]
